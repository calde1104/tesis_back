spring.application.name=tesis
server.port=5000
# ===============================
# CONFIGURACIÓN DE BASE DE DATOS
# ===============================
# El host es 'mysql-server' (el nombre del servicio en tu Docker)
# Usamos createDatabaseIfNotExist=true para que la cree sola si no existe
spring.datasource.url=jdbc:mysql://mysql-server:3306/tesis_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=changeme
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# ===============================
# CONFIGURACIÓN DE HIBERNATE/JPA
# ===============================
# 'update' crea y actualiza las tablas automáticamente en base a tu código Java
spring.jpa.hibernate.ddl-auto=update
# Muestra las consultas SQL en la consola (ideal para debuggear en la tesis)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect