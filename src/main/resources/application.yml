spring:
  application:
    name: tesis
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 5000

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32-bytes-min}
    expiration-hours: 12
  ingestion:
    storage-dir: ${INGESTION_STORAGE_DIR:./data/ingestion-uploads}
  notificaciones:
    umbral-demanda-cron: ${UMBRAL_DEMANDA_CRON:0 0 6 * * *}

ml:
  service:
    url: ${ML_SERVICE_URL:http://localhost:8001}

logging:
  level:
    root: INFO
    back.tesis: DEBUG
    org.hibernate.SQL: INFO
