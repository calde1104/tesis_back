services:
  api:
    build: .
    ports:
      - "5000:5000"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - DB_HOST=${DB_HOST:-mysql-db}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-tesis}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET:-un-secreto-super-seguro-tesis-2026-min-32-bytes}
      - SPRING_FLYWAY_BASELINE_ON_MIGRATE=true
      - SPRING_FLYWAY_BASELINE_VERSION=5
      - ML_SERVICE_URL=${ML_SERVICE_URL:-http://tesis-ia-api:8000}
    volumes:
      - ingestion-uploads:/app/data/ingestion-uploads
    networks:
      - tesis-network
    restart: always

networks:
  tesis-network:
    external: true

volumes:
  ingestion-uploads: